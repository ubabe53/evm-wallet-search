# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: evm-wallet-search
description: ERC20 Transfer indexer for one pinned Ethereum wallet.
ecosystem: evm
address_format: lowercase
storage:
  postgres:
    column_name_format: snake_case
contracts:
  - name: ERC20
    events:
      - event: "Transfer(address indexed from, address indexed to, uint256 value)"
        field_selection:
          transaction_fields:
            - hash
            - transactionIndex
chains:
  - id: 1
    start_block: 0
    contracts:
      - name: ERC20
