type Erc20Transfer {
  id: ID!
  chainId: Int!
  blockNumber: BigInt!
  blockHash: String!
  blockTimestamp: Int!
  transactionHash: String!
  transactionIndex: Int!
  transactionFromAddress: String
  transactionToAddress: String
  logIndex: Int!
  tokenAddress: String!
  fromAddress: String!
  toAddress: String!
  valueRaw: BigInt!
}
