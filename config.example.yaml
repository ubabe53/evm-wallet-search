# Copy this file to config.yaml. The local file is git-ignored.
envio:
  api_token: ""

analytics:
  hyperindex_postgres_dsn: ""
  # Explicit write-capable URI used only by bounded wallet scan jobs.
  wallet_scan_postgres_dsn: ""
  hyperindex_graphql_url: "http://127.0.0.1:8080/v1/graphql"

ethereum:
  rpc_url: ""
  public_rpc_url: "https://ethereum-rpc.publicnode.com"
  account_evidence:
    # Number of eth_getCode calls per JSON-RPC batch and retries per failed call.
    batch_size: 100
    max_retries: 2
    # Used only when the RPC endpoint does not support the Ethereum "safe" tag.
    fallback_confirmations: 64
