name: evm_wallet_search
version: 0.1.0
config-version: 2
profile: evm_wallet_search

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
docs-paths: ["docs"]

vars:
  use_fixture: true

on-run-start:
  - "{{ drop_relation_if_present('int_token_reputation') }}"
  - "{{ drop_relation_if_present('int_wallet_token_interactions') }}"
  - "{{ drop_relation_if_present('int_classified_wallet_transfer_events') }}"

models:
  evm_wallet_search:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  evm_wallet_search:
    +quote_columns: false
    raw_transfer_events_fixture:
      +column_types:
        chain_id: integer
        block_number: bigint
        block_hash: varchar
        block_timestamp: bigint
        transaction_hash: varchar
        transaction_index: integer
        transaction_from_address: varchar
        transaction_to_address: varchar
        log_index: integer
        token_address: varchar
        from_address: varchar
        to_address: varchar
        value_raw: varchar
    token_rpc_metadata:
      +column_types:
        token_address: varchar
        name: varchar
        symbol: varchar
        decimals: integer
        rpc_block_number: bigint
        fetched_at: varchar
        fetch_status: varchar
        error_code: varchar
    token_rpc_metadata_fixture:
      +column_types:
        token_address: varchar
        name: varchar
        symbol: varchar
        decimals: integer
        rpc_block_number: bigint
        fetched_at: varchar
        fetch_status: varchar
        error_code: varchar
