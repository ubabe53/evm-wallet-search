version: 2

models:
  - name: stg_erc20_transfers
    description: Deduplicated wallet-relevant Transfer-signature logs normalized to lowercase addresses; downstream models are ERC20-oriented, but the signature alone does not disambiguate ERC721.
    columns:
      - name: transfer_id
        tests:
          - unique
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: from_address
        tests:
          - not_null
      - name: to_address
        tests:
          - not_null
      - name: transaction_from_address
        description: Nullable top-level transaction sender; null for legacy rows without envelope evidence.
      - name: transaction_to_address
        description: Nullable top-level transaction target; null for legacy rows without envelope evidence or an unavailable target.
  - name: stg_token_metadata
    description: Token display metadata, exact-address recognition evidence, metadata availability, and reviewed manual overrides.
    columns:
      - name: token_address
        tests:
          - unique
          - not_null
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: metadata_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - manual
                  - trustwallet
                  - uniswap
                  - coingecko
                  - coinbase
                  - trustwallet+uniswap
                  - trustwallet+coingecko
                  - trustwallet+coinbase
                  - uniswap+coingecko
                  - uniswap+coinbase
                  - coingecko+coinbase
                  - trustwallet+uniswap+coingecko
                  - trustwallet+uniswap+coinbase
                  - trustwallet+coingecko+coinbase
                  - uniswap+coingecko+coinbase
                  - trustwallet+uniswap+coingecko+coinbase
                  - ethereum_rpc
      - name: metadata_availability
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["complete", "partial", "unavailable"]
      - name: recognition_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognized", "other"]
      - name: recognition_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-recognition-v1"]
      - name: token_quality
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high_confidence", "listed", "unknown"]
      - name: token_quality_source_count
        tests:
          - not_null
      - name: token_quality_reason
        tests:
          - not_null
      - name: token_quality_provenance
        tests:
          - not_null
      - name: token_quality_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-quality-v1"]
  - name: stg_counterparty_metadata
    description: Locally cached, pinned-block bytecode evidence for distinct nonzero, nonself Ethereum event counterparties. Safe and ERC-4337 evidence are not collected.
    columns:
      - name: address
        tests:
          - unique
          - not_null
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: code_state
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["no_code", "eip7702_delegated", "contract_code", "unknown"]
      - name: fetch_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["complete", "failed"]
      - name: observation_block_number
        tests:
          - not_null
      - name: evidence_schema_version
        tests:
          - not_null
  - name: int_token_reputation
    description: One explainable contract-level reputation result per observed emitting address; classification is ERC20-oriented, but the source signature does not prove token standard.
    columns:
      - name: token_address
        tests:
          - unique
          - not_null
      - name: token_reputation
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: token_reputation_score
        tests:
          - not_null
      - name: token_reputation_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-reputation-v2"]
      - name: token_quality
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high_confidence", "listed", "unknown"]
      - name: token_quality_source_count
        tests:
          - not_null
      - name: token_quality_version
        tests:
          - accepted_values:
              arguments:
                values: ["token-quality-v1"]
  - name: int_wallet_token_interactions
    description: Behavioral legitimacy evidence at wallet and token grain.
    columns:
      - name: interaction_legitimacy
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["not_suspicious", "uncertain", "suspicious"]
      - name: interaction_legitimacy_score
        tests:
          - not_null
      - name: indirect_inbound_transfer_count
        tests:
          - not_null
      - name: indirect_outbound_transfer_count
        tests:
          - not_null
  - name: wallet_events
    description: Dashboard event table, one row per wallet-relevant Transfer-signature log interpreted by ERC20-oriented models; token standard is not proven by the source signature.
    columns:
      - name: transfer_id
        tests:
          - unique
          - not_null
      - name: wallet_address
        tests:
          - not_null
      - name: from_address
        tests:
          - not_null
      - name: to_address
        tests:
          - not_null
      - name: counterparty_address
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: direction
        tests:
          - accepted_values:
              arguments:
                values: ["in", "out"]
      - name: transaction_sender_relation
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["transfer_sender", "transfer_recipient", "other", "unknown"]
      - name: transaction_target_relation
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token_contract", "transfer_sender", "transfer_recipient", "other", "unknown"]
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: recognition_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognized", "other"]
      - name: recognition_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-recognition-v1"]
      - name: metadata_availability
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["complete", "partial", "unavailable"]
      - name: token_quality
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high_confidence", "listed", "unknown"]
      - name: token_reputation_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-reputation-v2"]
      - name: token_quality_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-quality-v1"]
      - name: counterparty_account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
  - name: graph_nodes
    columns:
      - name: node_id
        tests:
          - unique
          - not_null
      - name: node_type
        tests:
          - accepted_values:
              arguments:
                values: ["wallet", "counterparty", "token"]
      - name: account_type
        tests:
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
  - name: graph_edges
    description: Two directed edge legs per wallet-token-counterparty interaction.
    columns:
      - name: edge_id
        tests:
          - unique
          - not_null
      - name: source_node_id
        tests:
          - not_null
      - name: target_node_id
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: edge_role
        tests:
          - accepted_values:
              arguments:
                values: ["wallet_token", "token_counterparty"]
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: recognition_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognized", "other"]
      - name: token_quality
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high_confidence", "listed", "unknown"]
      - name: token_reputation_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-reputation-v2"]
      - name: counterparty_account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: counterparty_transfer_count
        tests:
          - not_null
  - name: token_summary
    description: One row per wallet, emitting contract, effective recognition, internal status, quality, and exact counterparty account-evidence signature; models are ERC20-oriented, but the source signature does not prove token standard.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: recognition_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognized", "other"]
      - name: token_quality
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high_confidence", "listed", "unknown"]
      - name: token_reputation_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-reputation-v2"]
      - name: counterparty_account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: inbound_transfer_count
        tests:
          - not_null
      - name: outbound_transfer_count
        tests:
          - not_null
      - name: indirect_inbound_transfer_count
        tests:
          - not_null
      - name: indirect_outbound_transfer_count
        tests:
          - not_null
      - name: counterparty_count
        tests:
          - not_null
      - name: sender_account_count
        tests:
          - not_null
      - name: recipient_account_count
        tests:
          - not_null
  - name: counterparty_summary
    description: Eligible direct counterparties by wallet, effective token status, token quality, and address with observed-at account evidence, based on captured Transfer-signature events; excludes mint/burn, self, and emitting-contract addresses.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: counterparty_address
        tests:
          - not_null
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: token_quality
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high_confidence", "listed", "unknown"]
      - name: transfer_count
        tests:
          - not_null
      - name: inbound_transfer_count
        tests:
          - not_null
      - name: outbound_transfer_count
        tests:
          - not_null
  - name: timeline_daily
    description: Daily token flow at wallet, token, status, quality, exact counterparty account-evidence signature, and direction grain; token units are never mixed.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: block_date
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: token_quality
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high_confidence", "listed", "unknown"]
      - name: token_reputation_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-reputation-v2"]
      - name: counterparty_account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
  - name: pipeline_metadata
    description: Export provenance and complete mart counts for each configured wallet, including nullable account-evidence observation bounds. Fixture builds intentionally have no account evidence.
    columns:
      - name: wallet_address
        tests:
          - unique
          - not_null
      - name: data_source
        tests:
          - accepted_values:
              arguments:
                values: ["fixture", "hyperindex"]
      - name: account_evidence_observation_block_number_min
      - name: account_evidence_observation_block_number_max
      - name: account_evidence_observation_block_timestamp_min
      - name: account_evidence_observation_block_timestamp_max
