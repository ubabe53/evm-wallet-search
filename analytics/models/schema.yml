version: 2

models:
  - name: stg_transfer_events
    description: Deduplicated wallet-relevant Transfer-signature events normalized to lowercase addresses; the source signature does not establish token standard.
    columns:
      - name: chain_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
      - name: block_number
        tests:
          - not_null
      - name: block_hash
        description: Canonical block hash provided with the HyperIndex event and retained as lowercase event evidence.
        tests:
          - not_null
      - name: transaction_hash
        tests:
          - not_null
      - name: log_index
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: from_address
        tests:
          - not_null
      - name: to_address
        tests:
          - not_null
      - name: value_raw
        description: Exact base-10 string representation of the emitted uint256 third value; never converted to floating point.
        tests:
          - not_null
      - name: transaction_from_address
        description: Nullable top-level transaction sender; null for legacy rows without envelope evidence.
      - name: transaction_to_address
        description: Nullable top-level transaction target; null for legacy rows without envelope evidence or an unavailable target.
  - name: stg_wallets
    description: Configured wallet targets keyed by chain and normalized address; the configured ENS text remains presentation metadata rather than event identity.
    columns:
      - name: chain_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
      - name: wallet_address
        tests:
          - not_null
  - name: int_token_enrichment
    description: Resolved token display metadata, exact-address recognition evidence, metadata availability, and reviewed manual overrides at (chain_id, token_address) grain.
    columns:
      - name: chain_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
      - name: token_address
        tests:
          - not_null
      - name: metadata_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - manual
                  - trustwallet
                  - uniswap
                  - coingecko
                  - coinbase
                  - trustwallet+uniswap
                  - trustwallet+coingecko
                  - trustwallet+coinbase
                  - uniswap+coingecko
                  - uniswap+coinbase
                  - coingecko+coinbase
                  - trustwallet+uniswap+coingecko
                  - trustwallet+uniswap+coinbase
                  - trustwallet+coingecko+coinbase
                  - uniswap+coingecko+coinbase
                  - trustwallet+uniswap+coingecko+coinbase
                  - ethereum_rpc
      - name: metadata_availability
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["complete", "partial", "unavailable"]
      - name: recognition_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognized", "other"]
      - name: recognition_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token-recognition-v1"]
  - name: stg_account_evidence
    description: One retained pinned-block bytecode observation per (chain_id, address) from the local account-evidence cache. Safe- and ERC-4337-specific evidence are not collected.
    columns:
      - name: chain_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
      - name: address
        tests:
          - not_null
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: code_state
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["no_code", "eip7702_delegated", "contract_code", "unknown"]
      - name: fetch_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["complete", "failed"]
      - name: observation_block_number
        tests:
          - not_null
      - name: observation_block_hash
        tests:
          - not_null
      - name: observation_block_timestamp
        tests:
          - not_null
      - name: finality_policy
        tests:
          - not_null
      - name: reason_code
        tests:
          - not_null
      - name: evidence_schema_version
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["account-evidence-v2"]
      - name: fetched_at
        tests:
          - not_null
  - name: wallet_events
    description: Lean dashboard event projection at one row per configured wallet and captured Transfer-signature log; full row-level evidence remains in int_wallet_transfer_events.
    meta:
      grain: one row per configured wallet and captured Transfer-signature log
      primary_key:
        - chain_id
        - wallet_address
        - transaction_hash
        - log_index
      consumers:
        - local_api
        - fixture_exporter
    columns:
      - name: chain_id
        description: EVM chain identifier; currently always Ethereum mainnet (1).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
      - name: wallet_address
        description: Lowercase configured wallet relative to which direction and counterparty are defined.
        tests:
          - not_null
      - name: block_number
        description: Canonical event block number used for stable ordering and cursor pagination.
        tests:
          - not_null
      - name: block_timestamp
        description: Event block timestamp used for display and UTC period filtering.
        tests:
          - not_null
      - name: transaction_hash
        description: Lowercase transaction hash from the captured event identity.
        tests:
          - not_null
      - name: transaction_index
        description: Transaction position within the block, retained for deterministic event ordering.
        tests:
          - not_null
      - name: log_index
        description: Log position within the transaction and part of the canonical event key.
        tests:
          - not_null
      - name: token_address
        description: Lowercase emitting contract address; the shared signature does not prove token standard.
        tests:
          - not_null
      - name: token_symbol
        description: Nullable sourced token symbol used only for display.
      - name: token_name
        description: Nullable sourced token name used only for display and literal token search.
      - name: recognition_status
        description: Automatic exact-address registry classification before any local API override.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognized", "other"]
      - name: direction
        description: Wallet-relative emitted-event direction; self is evaluated before inbound or outbound.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["in", "out", "self"]
      - name: is_indirect
        description: True when observed transaction sender differs from emitted Transfer sender; null when envelope evidence is unavailable.
      - name: counterparty_address
        description: Other emitted participant for inbound/outbound events; equals the tracked wallet for self events.
        tests:
          - not_null
      - name: counterparty_account_type
        description: Observed-at account classification used by the dashboard filter.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: counterparty_code_state
        description: Observed bytecode state supporting the public account classification.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["no_code", "eip7702_delegated", "contract_code", "unknown"]
      - name: counterparty_observation_block_number
        description: Nullable pinned block at which successful account bytecode evidence was observed.
      - name: counterparty_eip7702_delegation_target
        description: Nullable exact EIP-7702 delegation target retained for account-type tooltip context.
  - name: graph_nodes
    columns:
      - name: node_id
        tests:
          - unique
          - not_null
      - name: node_type
        tests:
          - accepted_values:
              arguments:
                values: ["wallet", "counterparty", "token"]
      - name: account_type
        tests:
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
  - name: graph_edges
    description: Two directed edge legs per wallet-token-counterparty interaction.
    columns:
      - name: edge_id
        tests:
          - unique
          - not_null
      - name: source_node_id
        tests:
          - not_null
      - name: target_node_id
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: edge_role
        tests:
          - accepted_values:
              arguments:
                values: ["wallet_token", "token_counterparty"]
      - name: recognition_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognized", "other"]
      - name: counterparty_account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: counterparty_transfer_count
        tests:
          - not_null
  - name: token_summary
    description: One row per wallet, emitting contract, recognition status, and exact counterparty account-evidence signature; models are ERC20-oriented, but the source signature does not prove token standard.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: recognition_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["recognized", "other"]
      - name: counterparty_account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: inbound_transfer_count
        tests:
          - not_null
      - name: outbound_transfer_count
        tests:
          - not_null
      - name: indirect_inbound_transfer_count
        tests:
          - not_null
      - name: indirect_outbound_transfer_count
        tests:
          - not_null
      - name: self_transfer_count
        tests:
          - not_null
      - name: counterparty_count
        tests:
          - not_null
      - name: sender_account_count
        tests:
          - not_null
      - name: recipient_account_count
        tests:
          - not_null
  - name: counterparty_summary
    description: Eligible direct counterparties by wallet, recognition status, and address with observed-at account evidence, based on captured Transfer-signature events; excludes mint/burn, self, and emitting-contract addresses.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: counterparty_address
        tests:
          - not_null
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: transfer_count
        tests:
          - not_null
      - name: inbound_transfer_count
        tests:
          - not_null
      - name: outbound_transfer_count
        tests:
          - not_null
  - name: timeline_daily
    description: Daily token flow at wallet, token, recognition, exact counterparty account-evidence signature, and direction grain; token units are never mixed.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: block_date
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: counterparty_account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "contract", "unknown"]
      - name: direction
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["in", "out", "self"]
  - name: pipeline_metadata
    description: Export provenance and complete mart counts for each configured chain-and-wallet key, including finalized contiguous snapshot coverage in live mode and population-reconciled account-evidence coverage. Fixture builds intentionally have no indexer checkpoint or account evidence.
    columns:
      - name: chain_id
        tests:
          - not_null
      - name: wallet_address
        tests:
          - not_null
      - name: data_source
        tests:
          - accepted_values:
              arguments:
                values: ["fixture", "hyperindex"]
      - name: snapshot_run_id
      - name: snapshot_start_block
      - name: snapshot_increment_start_block
      - name: snapshot_end_block
      - name: snapshot_end_block_hash
      - name: snapshot_finality_policy
      - name: snapshot_scope_version
      - name: account_evidence_population_scope
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["distinct_nonzero_nonself_event_counterparties"]
      - name: account_evidence_eligible_address_count
        tests:
          - not_null
      - name: account_evidence_classified_address_count
        tests:
          - not_null
      - name: account_evidence_failed_address_count
        tests:
          - not_null
      - name: account_evidence_not_checked_address_count
        tests:
          - not_null
      - name: account_evidence_address_coverage_rate
      - name: account_evidence_eligible_event_count
        tests:
          - not_null
      - name: account_evidence_classified_event_count
        tests:
          - not_null
      - name: account_evidence_failed_event_count
        tests:
          - not_null
      - name: account_evidence_not_checked_event_count
        tests:
          - not_null
      - name: account_evidence_event_coverage_rate
      - name: account_evidence_observation_block_number_min
      - name: account_evidence_observation_block_number_max
      - name: account_evidence_observation_block_timestamp_min
      - name: account_evidence_observation_block_timestamp_max
