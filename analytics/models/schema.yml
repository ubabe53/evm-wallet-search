version: 2

models:
  - name: stg_erc20_transfers
    description: Deduplicated raw ERC20 transfer events normalized to lowercase addresses.
    columns:
      - name: transfer_id
        tests:
          - unique
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: from_address
        tests:
          - not_null
      - name: to_address
        tests:
          - not_null
      - name: transaction_from_address
        description: Nullable top-level transaction sender; null for legacy rows without envelope evidence.
      - name: transaction_to_address
        description: Nullable top-level transaction target; null for legacy rows without envelope evidence or an unavailable target.
  - name: stg_token_metadata
    description: Curated Trust Wallet, Uniswap, and CoinGecko registry plus reviewed manual token-label overrides.
    columns:
      - name: token_address
        tests:
          - unique
          - not_null
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: metadata_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["manual", "trustwallet", "uniswap", "coingecko", "trustwallet+uniswap", "trustwallet+coingecko", "uniswap+coingecko", "trustwallet+uniswap+coingecko", "ethereum_rpc"]
  - name: stg_counterparty_metadata
    description: Pinned-block account evidence for enriched Ethereum counterparty addresses, including independent Safe observations and deployment-clamped, chunked canonical EntryPoint sender evidence with explicit successful and failed ranges.
    columns:
      - name: address
        tests:
          - unique
          - not_null
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "eip7702_delegated", "safe", "erc4337_account", "contract", "unknown"]
      - name: code_state
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["no_code", "eip7702_delegated", "contract_code", "unknown"]
      - name: fetch_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["complete", "partial", "failed"]
      - name: observation_block_number
        tests:
          - not_null
      - name: evidence_schema_version
        tests:
          - not_null
  - name: int_token_reputation
    description: One explainable contract-level reputation result per ERC20 address.
    columns:
      - name: token_address
        tests:
          - unique
          - not_null
      - name: token_reputation
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: token_reputation_score
        tests:
          - not_null
  - name: int_wallet_token_interactions
    description: Behavioral legitimacy evidence at wallet and token grain.
    columns:
      - name: interaction_legitimacy
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["not_suspicious", "uncertain", "suspicious"]
      - name: interaction_legitimacy_score
        tests:
          - not_null
      - name: indirect_inbound_transfer_count
        tests:
          - not_null
      - name: indirect_outbound_transfer_count
        tests:
          - not_null
  - name: wallet_events
    description: Dashboard event table, one row per wallet-relevant ERC20 transfer.
    columns:
      - name: transfer_id
        tests:
          - unique
          - not_null
      - name: wallet_address
        tests:
          - not_null
      - name: from_address
        tests:
          - not_null
      - name: to_address
        tests:
          - not_null
      - name: counterparty_address
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: direction
        tests:
          - accepted_values:
              arguments:
                values: ["in", "out"]
      - name: transaction_sender_relation
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["transfer_sender", "transfer_recipient", "other", "unknown"]
      - name: transaction_target_relation
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["token_contract", "transfer_sender", "transfer_recipient", "other", "unknown"]
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: counterparty_account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "eip7702_delegated", "safe", "erc4337_account", "contract", "unknown"]
      - name: counterparty_is_safe
        tests:
          - not_null
      - name: counterparty_is_erc4337_account
        tests:
          - not_null
  - name: graph_nodes
    columns:
      - name: node_id
        tests:
          - unique
          - not_null
      - name: node_type
        tests:
          - accepted_values:
              arguments:
                values: ["wallet", "counterparty", "token"]
      - name: account_type
        tests:
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "eip7702_delegated", "safe", "erc4337_account", "contract", "unknown"]
  - name: graph_edges
    description: Two directed edge legs per wallet-token-counterparty interaction.
    columns:
      - name: edge_id
        tests:
          - unique
          - not_null
      - name: source_node_id
        tests:
          - not_null
      - name: target_node_id
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: edge_role
        tests:
          - accepted_values:
              arguments:
                values: ["wallet_token", "token_counterparty"]
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: counterparty_transfer_count
        tests:
          - not_null
  - name: token_summary
    description: One row per wallet and ERC20 token, aggregating inbound and outbound transfer events without mixing token units.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: inbound_transfer_count
        tests:
          - not_null
      - name: outbound_transfer_count
        tests:
          - not_null
      - name: indirect_inbound_transfer_count
        tests:
          - not_null
      - name: indirect_outbound_transfer_count
        tests:
          - not_null
      - name: counterparty_count
        tests:
          - not_null
      - name: sender_account_count
        tests:
          - not_null
      - name: recipient_account_count
        tests:
          - not_null
  - name: counterparty_summary
    description: Eligible direct ERC20 counterparties by wallet, token status, and address with pinned-block account evidence; excludes mint/burn, self, and token-contract addresses.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: counterparty_address
        tests:
          - not_null
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["eoa_candidate", "eip7702_delegated", "safe", "erc4337_account", "contract", "unknown"]
      - name: is_safe
        tests:
          - not_null
      - name: is_erc4337_account
        tests:
          - not_null
      - name: transfer_count
        tests:
          - not_null
      - name: inbound_transfer_count
        tests:
          - not_null
      - name: outbound_transfer_count
        tests:
          - not_null
  - name: timeline_daily
    description: Daily token flow at wallet, token, and direction grain; token units are never mixed.
    columns:
      - name: wallet_address
        tests:
          - not_null
      - name: block_date
        tests:
          - not_null
      - name: token_address
        tests:
          - not_null
      - name: token_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["trusted", "unverified", "suspected_spam", "spam"]
  - name: pipeline_metadata
    description: Export provenance and complete mart counts for each configured wallet, including minimum and maximum account-evidence observation block/time across mixed enrichment batches.
    columns:
      - name: wallet_address
        tests:
          - unique
          - not_null
      - name: data_source
        tests:
          - accepted_values:
              arguments:
                values: ["fixture", "hyperindex"]
      - name: account_evidence_observation_block_number_min
        tests:
          - not_null
      - name: account_evidence_observation_block_number_max
        tests:
          - not_null
      - name: account_evidence_observation_block_timestamp_min
        tests:
          - not_null
      - name: account_evidence_observation_block_timestamp_max
        tests:
          - not_null
