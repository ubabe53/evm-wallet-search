version: 2

seeds:
  - name: raw_transfer_events_fixture
    description: Exactly 100 deterministic synthetic captured-event examples used only by semantic and edge-case tests; the example dates, identifiers, addresses, and participant pairs are not claims about Ethereum history. {{ doc('bounded_fixture') }}
    meta:
      grain: one captured Transfer-signature log
      primary_key: [chain_id, transaction_hash, log_index]
      provenance: checked-in deterministic test fixture
      consumers: [stg_transfer_events]
    columns:
      - name: chain_id
        description: EVM chain identifier in the fixture.
      - name: block_number
        description: Fixture event block number.
      - name: block_hash
        description: Fixture lowercase canonical-looking block hash.
      - name: block_timestamp
        description: Fixture event block timestamp as Unix seconds.
      - name: transaction_hash
        description: Fixture transaction hash.
      - name: transaction_index
        description: Fixture transaction position within its block.
      - name: transaction_from_address
        description: Nullable fixture top-level transaction sender.
      - name: transaction_to_address
        description: Nullable fixture top-level transaction target.
      - name: log_index
        description: Fixture log position within its transaction.
      - name: token_address
        description: Fixture emitting contract address.
      - name: from_address
        description: Fixture emitted `from` participant.
      - name: to_address
        description: Fixture emitted `to` participant.
      - name: value_raw
        description: "{{ doc('exact_raw_value') }}"

  - name: raw_transfer_events_demo
    description: Checked-in Ethereum mainnet event snapshot for the attributed Gitcoin demo wallet, collected by HyperIndex through the finalized boundary recorded in `demo_snapshot`. {{ doc('transfer_signature_scope') }}
    meta:
      grain: one captured Transfer-signature log
      primary_key: [chain_id, transaction_hash, log_index]
      provenance: finalized Envio HyperIndex snapshot
      consumers: [stg_transfer_events in demo mode]
    columns:
      - name: chain_id
        description: Ethereum mainnet chain identifier.
      - name: block_number
        description: Canonical event block number.
      - name: block_hash
        description: Canonical event block hash observed by HyperIndex.
      - name: block_timestamp
        description: Event block timestamp as Unix seconds.
      - name: transaction_hash
        description: Canonical transaction hash.
      - name: transaction_index
        description: Transaction position within its block.
      - name: transaction_from_address
        description: Nullable top-level transaction sender.
      - name: transaction_to_address
        description: Nullable top-level transaction target.
      - name: log_index
        description: Log position within the transaction.
      - name: token_address
        description: Contract that emitted the captured Transfer signature.
      - name: from_address
        description: Emitted `from` participant.
      - name: to_address
        description: Emitted `to` participant.
      - name: value_raw
        description: "{{ doc('exact_raw_value') }}"

  - name: demo_snapshot
    description: Finalized coverage, collection provenance, and public wallet-attribution source for the checked-in mainnet demo.
    meta:
      grain: one configured mainnet demo wallet
      primary_key: [chain_id, wallet_address]
      provenance: completed live scan plus official Gitcoin documentation
      consumers: [pipeline_metadata in demo mode]
    columns:
      - name: chain_id
        description: Ethereum mainnet chain identifier.
      - name: wallet_address
        description: Lowercase Gitcoin Schelling Point multisig address.
      - name: snapshot_run_id
        description: Completed local pipeline run that produced the checked-in snapshot.
      - name: snapshot_generation_id
        description: Finalized scan generation associated with the completed run.
      - name: snapshot_start_block
        description: Inclusive beginning of complete snapshot coverage.
      - name: snapshot_end_block
        description: Inclusive Ethereum finalized endpoint.
      - name: snapshot_end_block_hash
        description: Canonical hash revalidated for the finalized endpoint.
      - name: snapshot_finality_policy
        description: Finality policy applied to the snapshot endpoint.
      - name: snapshot_scope_version
        description: Versioned Transfer-signature collection scope.
      - name: snapshot_generated_at
        description: UTC completion time of the supporting pipeline run.
      - name: snapshot_source
        description: Collector that produced the event facts.
      - name: snapshot_schema_version
        description: Checked-in demo snapshot contract version.
      - name: wallet_attribution_source_url
        description: Official Gitcoin documentation supporting the configured entity label.

  - name: wallets_demo
    description: Publicly attributed wallet target used only by the static historical-mainnet demo.
    meta:
      grain: one configured demo wallet
      primary_key: [address]
      provenance: official Gitcoin DAO finance documentation
      consumers: [stg_wallets in demo mode]
    columns:
      - name: ens
        description: Configured public entity label; not an ENS-resolution observation.
      - name: address
        description: Canonical Gitcoin Schelling Point multisig address.

  - name: token_rpc_metadata_demo
    description: Pinned safe-block RPC metadata observations for every emitting contract in the mainnet demo snapshot.
    meta:
      grain: one metadata observation per emitting contract
      primary_key: [token_address]
      provenance: explicit Ethereum RPC observation at the recorded block
      consumers: [int_token_enrichment in demo mode]
    columns:
      - name: token_address
        description: Lowercase emitting contract address.
      - name: name
        description: Nullable self-declared `name()` result.
      - name: symbol
        description: Nullable self-declared `symbol()` result.
      - name: decimals
        description: Nullable self-declared `decimals()` result.
      - name: rpc_block_number
        description: Pinned safe block used for each call.
      - name: fetched_at
        description: UTC observation completion time.
      - name: fetch_status
        description: Complete, partial, or failed observation state.
      - name: error_code
        description: Nullable machine-readable missing-field detail.

  - name: account_evidence_demo
    description: Pinned safe-block bytecode observations for every eligible counterparty in the mainnet demo snapshot. {{ doc('account_type') }}
    meta:
      grain: one account-code observation per eligible counterparty
      primary_key: [chain_id, address]
      provenance: explicit Ethereum RPC observation at the recorded block
      consumers: [stg_account_evidence in demo mode]
    columns:
      - name: chain_id
        description: Ethereum mainnet chain identifier.
      - name: address
        description: Lowercase eligible counterparty address.
      - name: account_type
        description: Binary public classification from the observed code state.
      - name: code_state
        description: "{{ doc('code_state') }}"
      - name: code_size_bytes
        description: Observed bytecode length in bytes.
      - name: observation_block_number
        description: Pinned safe block used for code observation.
      - name: observation_block_hash
        description: Canonical hash of the observation block.
      - name: observation_block_timestamp
        description: UTC timestamp of the observation block.
      - name: finality_policy
        description: RPC block policy used for the observation.
      - name: eip7702_delegation_target
        description: Nullable delegated-code target when an EIP-7702 designator was observed.
      - name: fetch_status
        description: Complete or failed evidence state.
      - name: reason_code
        description: Machine-readable reason supporting the classification.
      - name: evidence_schema_version
        description: Account-evidence contract version.
      - name: fetched_at
        description: UTC observation completion time.

  - name: wallets
    description: Checked-in configured wallet target and pinned display metadata.
    meta:
      grain: one configured wallet
      primary_key: [address]
      provenance: checked-in project configuration
      refresh_policy: recreated on every dbt build because this is a tiny configuration seed
      consumers: [stg_wallets]
    columns:
      - name: ens
        description: Configured display alias; not resolved during builds.
      - name: address
        description: Canonical configured Ethereum address.

  - name: token_metadata
    description: Generated exact-address token registry snapshot used for automatic recognition and display metadata.
    meta:
      grain: one Ethereum token contract address
      primary_key: [token_address]
      provenance: generated from selected external exact-address registries
      consumers: [int_token_enrichment]
    columns:
      - name: token_address
        description: Lowercase Ethereum contract address used for exact matching.
      - name: symbol
        description: Nullable registry-derived token symbol.
      - name: name
        description: Nullable registry-derived token name.
      - name: decimals
        description: Nullable registry-derived decimals metadata.
      - name: recognition_status
        description: Registry-derived automatic status; generated rows are recognized.
      - name: metadata_source
        description: Registry or joined registry set in which the exact address appeared.
      - name: metadata_source_url
        description: URL or joined provenance value for the registry snapshot.

  - name: token_label_overrides
    description: Small reviewed seed for explicit token display or automatic-recognition corrections.
    meta:
      grain: one reviewed Ethereum token contract address
      primary_key: [token_address]
      provenance: checked-in manual review
      consumers: [int_token_enrichment]
    columns:
      - name: token_address
        description: Lowercase Ethereum contract address receiving the reviewed override.
      - name: symbol
        description: Nullable reviewed display symbol.
      - name: name
        description: Nullable reviewed display name.
      - name: decimals
        description: Nullable reviewed decimals metadata.
      - name: recognition_status
        description: Nullable reviewed automatic classification of recognized or other.
      - name: reason
        description: Reviewer-authored rationale for the seed row.
      - name: source_url
        description: Nullable URL supporting the reviewed row.

  - name: token_rpc_metadata
    description: Ignored/local-style RPC metadata observations used by live builds after explicit enrichment; failed rows remain diagnostic and are excluded from selected metadata.
    meta:
      grain: one latest RPC metadata attempt per token contract
      primary_key: [token_address]
      provenance: explicit pinned-block Ethereum RPC enrichment
      consumers: [int_token_enrichment in live mode]
    columns:
      - name: token_address
        description: Lowercase Ethereum token-emitting contract address.
      - name: name
        description: Nullable decoded RPC token name.
      - name: symbol
        description: Nullable decoded RPC token symbol.
      - name: decimals
        description: Nullable decoded RPC token decimals.
      - name: rpc_block_number
        description: Pinned block number at which metadata calls were made.
      - name: fetched_at
        description: UTC observation completion time serialized in the seed.
      - name: fetch_status
        description: Complete, partial, or failed metadata observation state.
      - name: error_code
        description: Nullable machine-readable RPC or ABI decoding error.

  - name: token_rpc_metadata_fixture
    description: Deterministic synthetic RPC metadata observation fixture used to test precedence, example display labels, and partial metadata behavior.
    meta:
      grain: one fixture RPC metadata attempt per token contract
      primary_key: [token_address]
      provenance: checked-in deterministic RPC metadata fixture
      consumers: [int_token_enrichment in fixture mode]
    columns:
      - name: token_address
        description: Fixture Ethereum token-emitting contract address.
      - name: name
        description: Nullable fixture decoded token name.
      - name: symbol
        description: Nullable fixture decoded token symbol.
      - name: decimals
        description: Nullable fixture decoded token decimals.
      - name: rpc_block_number
        description: Fixture pinned RPC block number.
      - name: fetched_at
        description: Fixture observation completion time.
      - name: fetch_status
        description: Fixture complete, partial, or failed observation state.
      - name: error_code
        description: Nullable fixture RPC or ABI decoding error.
